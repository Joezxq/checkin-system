version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: checkin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Zyy315454!
      MYSQL_DATABASE: checkin_system
      MYSQL_USER: checkin
      MYSQL_PASSWORD: checkin123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 按顺序执行 SQL 文件
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/migration_v2.sql:/docker-entrypoint-initdb.d/02-migration_v2.sql
      - ./sql/migration_v3.sql:/docker-entrypoint-initdb.d/03-migration_v3.sql
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/04-seed.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    networks:
      - checkin-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pZyy315454!"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkin-app
    ports:
      - "8088:8088"
    environment:
      # 覆盖应用内部的所有数据库配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/checkin_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Zyy315454!
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: com.mysql.cj.jdbc.Driver
      # 如果应用使用 Hikari 连接池
      SPRING_DATASOURCE_HIKARI_USERNAME: root
      SPRING_DATASOURCE_HIKARI_PASSWORD: Zyy315454!
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - checkin-network
    volumes:
      - ./logs:/app/logs
    restart: always
    command: >
      java -jar app.jar
      --spring.datasource.username=root
      --spring.datasource.password=Zyy315454!
      --spring.datasource.url=jdbc:mysql://mysql:3306/checkin_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false

volumes:
  mysql-data:

networks:
  checkin-network:
    driver: bridge
