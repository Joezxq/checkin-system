<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>实时签到</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center"><span class="navbar-brand">📊 实时签到</span><div class="d-flex gap-2"><button class="btn btn-danger" id="closeBtn" onclick="closeSession()">⏹ 关闭签到</button><button class="btn btn-outline-secondary" onclick="navigateTo('/teacher/courses.html')">← 返回</button></div></nav>
<div class="row g-3 mb-3"><div class="col-md-4"><div class="stat-card"><div class="stat-number" id="totalCount">-</div><div class="stat-label">总人数</div></div></div><div class="col-md-4"><div class="stat-card" style="border-top:3px solid var(--success);"><div class="stat-number" id="signedCount">-</div><div class="stat-label">已签到</div></div></div><div class="col-md-4"><div class="stat-card" style="border-top:3px solid var(--danger);"><div class="stat-number" id="unsignedCount">-</div><div class="stat-label">未签到</div></div></div></div>
<div class="row g-3"><div class="col-lg-4"><div class="glass-card"><h6 class="text-center mb-3">📱 扫码签到</h6><div class="qr-container" id="qrcode"></div><div id="qrText" class="text-center text-muted small mt-2" style="word-break:break-all;"></div></div></div><div class="col-lg-8"><div class="glass-card"><h6 class="mb-3">✅ 已签到学生</h6><div id="signedList" class="text-center py-4"><div class="spinner-custom"></div></div></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
const sessionId=getUrlParam('sessionId');let refresh, qr=null;
async function load(){try{const d=await get(`/api/teacher/sessions/${sessionId}/realtime`);document.getElementById('totalCount').textContent=d.totalCount;document.getElementById('signedCount').textContent=d.signedCount;document.getElementById('unsignedCount').textContent=d.unsignedCount;if(d.status!=='OPEN'){document.getElementById('closeBtn').style.display='none';document.getElementById('qrcode').innerHTML='<div class="alert alert-warning text-center">签到已关闭</div>';document.getElementById('qrText').textContent='';}if(d.status==='OPEN'&&d.qrToken&&!qr){renderQR(d.qrToken);}const el=document.getElementById('signedList');if(!d.records||d.records.length===0){el.innerHTML='<div class="text-center py-3 text-muted">暂无记录</div>';return;}el.innerHTML=`<div class="table-responsive"><table class="table table-hover table-sm"><thead><tr><th>学号</th><th>姓名</th><th>时间</th><th>IP</th></tr></thead><tbody>${d.records.map(r=>{const s=d.signedStudents.find(st=>st.id===r.studentId);return`<tr><td>${s?escapeHtml(s.studentNo):'-'}</td><td class="fw-semibold">${s?escapeHtml(s.name):'-'}</td><td class="text-muted small">${formatDateTime(r.signTime)}</td><td class="text-muted small">${r.clientIp}</td></tr>`}).join('')}</tbody></table></div>`;}catch(e){if(e.message.includes('未登录'))navigateTo('/teacher/login.html');}}
function renderQR(token){const el=document.getElementById('qrcode');el.innerHTML='';el.style.minHeight='200px';qr=new QRCode(el,{text:`CHECKIN:${sessionId}:${token}`,width:200,height:200,colorDark:'#7c5cfc',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});document.getElementById('qrText').textContent=`CHECKIN:${sessionId}:${token}`;}
async function closeSession(){showConfirm('关闭签到','确定关闭？',async()=>{try{const s=await post(`/api/teacher/sessions/${sessionId}/close`);clearInterval(refresh);document.getElementById('closeBtn').style.display='none';document.getElementById('qrcode').innerHTML='<div class="alert alert-warning text-center">已关闭</div>';document.getElementById('qrText').textContent='';showStats(s);load();}catch(e){showError(e.message);}});}
function showStats(s){const rc=s.attendanceRate<60?'rate-low':s.attendanceRate<80?'rate-medium':'rate-high';const m=`<div class="modal fade" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5>📊 签到统计</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body text-center py-4"><div class="rate-circle ${rc} mx-auto mb-3"><span class="rate-num">${s.attendanceRate}%</span><span class="rate-label">签到率</span></div><div class="row g-3 mt-2"><div class="col-4"><div class="border rounded p-2" style="border-color:rgba(255,255,255,0.1)!important;"><div class="fw-bold fs-5">${s.totalCount}</div><small class="text-muted">总人数</small></div></div><div class="col-4"><div class="border rounded p-2" style="border-color:rgba(0,230,118,0.3)!important;"><div class="fw-bold fs-5 text-success">${s.signedCount}</div><small class="text-muted">已签到</small></div></div><div class="col-4"><div class="border rounded p-2" style="border-color:rgba(255,82,82,0.3)!important;"><div class="fw-bold fs-5 text-danger">${s.unsignedCount}</div><small class="text-muted">未签到</small></div></div></div></div><div class="modal-footer"><button class="btn btn-gradient" data-bs-dismiss="modal">确定</button></div></div></div></div>`;const w=document.createElement('div');w.innerHTML=m;document.body.appendChild(w.firstElementChild);const modal=new bootstrap.Modal(document.body.lastElementChild);modal.show();modal._element.addEventListener('hidden.bs.modal',()=>modal._element.remove());}
load();refresh=setInterval(load,3000);window.addEventListener('beforeunload',()=>clearInterval(refresh));
</script>
</body></html>
