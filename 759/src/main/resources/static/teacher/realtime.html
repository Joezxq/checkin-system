<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>实时签到</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.signed-row { animation: fadeInUp 0.3s ease-out; }
.unsigned-row { color: var(--text-muted); }
.student-list { max-height: 400px; overflow-y: auto; }
@keyframes fadeInUp { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
</style>
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="navbar-brand">📊 <span id="navTitle">实时签到</span></span>
    <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-warning btn-sm" id="extendBtn" onclick="extendSession()">⏱ 延长</button>
        <button class="btn btn-danger btn-sm" id="closeBtn" onclick="closeSession()">⏹ 关闭签到</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="leavePage()">← 返回</button>
    </div>
</nav>

<!-- 签到信息 -->
<div class="glass-card mb-3 p-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
        <div><h5 id="sessionTitle" class="mb-1">加载中...</h5><small id="sessionTimes" class="text-muted"></small></div>
        <div id="statusBadge"></div>
    </div>
</div>

<!-- 统计卡片 -->
<div class="row g-2 mb-3">
    <div class="col-3"><div class="stat-card text-center p-2"><div class="stat-number" id="totalCount">-</div><div class="stat-label">总人数</div></div></div>
    <div class="col-3"><div class="stat-card text-center p-2" style="border-top:3px solid #28a745;"><div class="stat-number text-success" id="signedCount">-</div><div class="stat-label">✅ 已签到</div></div></div>
    <div class="col-3"><div class="stat-card text-center p-2" style="border-top:3px solid #dc3545;"><div class="stat-number text-danger" id="unsignedCount">-</div><div class="stat-label">❌ 未签到</div></div></div>
    <div class="col-3"><div class="stat-card text-center p-2"><div class="stat-number" id="attendanceRate">-</div><div class="stat-label">📊 签到率</div></div></div>
</div>

<!-- 二维码 + 学生列表 -->
<div class="row g-3">
    <div class="col-lg-4"><div class="glass-card"><h6 class="text-center mb-2">📱 扫码签到</h6><div class="qr-container mx-auto" id="qrcode" style="min-height:200px;"></div><div id="qrText" class="text-center text-muted small mt-2" style="word-break:break-all;"></div></div></div>
    <div class="col-lg-8">
        <ul class="nav nav-tabs mb-2" id="studentTabs">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#signedTab">✅ 已签到 <span class="badge bg-success" id="signedBadge">0</span></button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#unsignedTab">❌ 未签到 <span class="badge bg-danger" id="unsignedBadge">0</span></button></li>
        </ul>
        <div class="tab-content">
            <div class="tab-pane fade show active" id="signedTab"><div class="student-list" id="signedList"><div class="text-center py-4 text-muted"><div class="spinner-custom"></div></div></div></div>
            <div class="tab-pane fade" id="unsignedTab"><div class="student-list" id="unsignedList"><div class="text-center py-4 text-muted"><div class="spinner-custom"></div></div></div></div>
        </div>
    </div>
</div>
</div>

<div class="modal fade" id="extendModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
<div class="modal-header"><h5>⏱ 延长签到</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
    <div class="d-flex gap-2 mb-3"><button class="btn btn-outline-success flex-fill" onclick="doExtend(5)">+5 分钟</button><button class="btn btn-outline-success flex-fill" onclick="doExtend(10)">+10 分钟</button></div>
    <div class="mb-3"><label>自定义（分钟）</label><input class="form-control" id="customExtend" type="number" value="3" min="1" max="60"></div>
    <button class="btn btn-gradient w-100" onclick="doExtend(parseInt(document.getElementById('customExtend').value)||3)">确认延长</button>
</div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
const sessionId=getUrlParam('sessionId');
let refresh=null, qr=null, wasActive=false;
const extendModal=new bootstrap.Modal(document.getElementById('extendModal'));

async function load(){
    const d=await get(`/api/teacher/sessions/${sessionId}/realtime`);
    const isActive = d.status === 'IN_PROGRESS';

    // Update nav title
    document.getElementById('navTitle').textContent = d.title || '实时签到';

    // Status badge
    document.getElementById('statusBadge').innerHTML = isActive
        ? '<span class="badge bg-success" style="animation:pulse-glow 2s infinite;">● 进行中</span>'
        : '<span class="badge bg-secondary">已结束</span>';

    // Stats
    document.getElementById('totalCount').textContent = d.totalCount;
    document.getElementById('signedCount').textContent = d.signedCount;
    document.getElementById('unsignedCount').textContent = d.unsignedCount;
    const rate = d.totalCount > 0 ? Math.round(d.signedCount * 1000 / d.totalCount) / 10 : 0;
    document.getElementById('attendanceRate').textContent = rate + '%';
    document.getElementById('signedBadge').textContent = d.signedCount;
    document.getElementById('unsignedBadge').textContent = d.unsignedCount;

    // Session times
    let timeInfo = `开始: ${formatDateTime(d.startTime)} | 截止: ${d.endTime?formatDateTime(d.endTime):'--'}`;
    if(d.normalEndTime) timeInfo += ` | 正常: ${formatDateTime(d.normalEndTime)}`;
    if(d.lateEndTime) timeInfo += ` | 迟到: ${formatDateTime(d.lateEndTime)}`;
    document.getElementById('sessionTimes').textContent = timeInfo;

    // QR code
    if(isActive && d.qrToken && !qr) renderQR(d.qrToken);

    // Signed students
    renderSignedList(d);

    // Unsigned students
    renderUnsignedList(d);

    // Stop polling when inactive
    if(!isActive && wasActive) {
        document.getElementById('closeBtn').style.display='none';
        document.getElementById('extendBtn').style.display='none';
        document.getElementById('qrcode').innerHTML='<div class="alert alert-warning text-center mb-0">签到已结束</div>';
        document.getElementById('qrText').textContent='';
        if(refresh) { clearInterval(refresh); refresh=null; }
    }
    if(isActive) {
        document.getElementById('closeBtn').style.display='';
        document.getElementById('extendBtn').style.display='';
    }
    wasActive = isActive;
}

function renderSignedList(d){
    const el=document.getElementById('signedList');
    if(!d.records||d.records.length===0){
        el.innerHTML='<div class="text-center py-3 text-muted">暂无已签到学生</div>'; return;
    }
    el.innerHTML=`<table class="table table-sm table-hover mb-0"><thead><tr><th>学号</th><th>姓名</th><th>签到时间</th></tr></thead><tbody>${
        d.records.map(r=>{
            const s=d.signedStudents.find(st=>st.id===r.studentId);
            const cls = d.normalEndTime && r.signTime && r.signTime > d.normalEndTime ? 'text-warning' : '';
            return`<tr class="signed-row ${cls}"><td><small>${s?escapeHtml(s.studentNo):'-'}</small></td><td class="fw-semibold">${s?escapeHtml(s.name):'学生#'+r.studentId}</td><td class="text-muted small">${formatDateTime(r.signTime)}</td></tr>`;
        }).join('')
    }</tbody></table>`;
}

function renderUnsignedList(d){
    const el=document.getElementById('unsignedList');
    if(!d.unsignedStudents||d.unsignedStudents.length===0){
        el.innerHTML='<div class="text-center py-3 text-muted">🎉 全部已签到！</div>'; return;
    }
    el.innerHTML=`<table class="table table-sm table-hover mb-0"><thead><tr><th>学号</th><th>姓名</th><th>班级</th></tr></thead><tbody>${
        d.unsignedStudents.map(s=>`<tr class="unsigned-row"><td><small>${escapeHtml(s.studentNo)}</small></td><td>${escapeHtml(s.name)}</td><td><small class="text-muted">${escapeHtml(s.className||'')}</small></td></tr>`).join('')
    }</tbody></table>`;
}

function renderQR(token){
    const el=document.getElementById('qrcode');
    el.innerHTML='';
    try{
        qr=new QRCode(el,{text:`CHECKIN:${sessionId}:${token}`,width:200,height:200,colorDark:'#7c5cfc',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
        document.getElementById('qrText').textContent=`CHECKIN:${sessionId}:${token}`;
    }catch(e){
        el.innerHTML=`<div class="alert alert-warning text-center mb-0">二维码库加载失败<br><small class="text-muted">请使用手动签到</small></div>`;
        document.getElementById('qrText').textContent=`CHECKIN:${sessionId}:${token}`;
    }
}

function extendSession(){ extendModal.show(); }
async function doExtend(minutes){
    try{await post(`/api/teacher/sessions/${sessionId}/extend`,{extendMinutes:minutes});extendModal.hide();showToast(`已延长 ${minutes} 分钟`,'success');load();}
    catch(e){showError(e.message);}
}

async function closeSession(){
    showConfirm('关闭签到','确定关闭吗？关闭后将自动生成考勤结果。',async()=>{
        try{
            const s=await post(`/api/teacher/sessions/${sessionId}/close`);
            if(refresh){clearInterval(refresh);refresh=null;}
            document.getElementById('closeBtn').style.display='none';
            document.getElementById('extendBtn').style.display='none';
            document.getElementById('qrcode').innerHTML='<div class="alert alert-warning text-center mb-0">已关闭</div>';
            document.getElementById('qrText').textContent='';
            showStats(s);
            load();
        }catch(e){showError(e.message);}
    });
}

function showStats(s){
    const rc=s.attendanceRate<60?'rate-low':s.attendanceRate<80?'rate-medium':'rate-high';
    const m=`<div class="modal fade" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content"><div class="modal-header"><h5>📊 签到统计</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body text-center py-4">
    <div class="rate-circle ${rc} mx-auto mb-3"><span class="rate-num">${s.attendanceRate}%</span><span class="rate-label">签到率</span></div>
    <div class="row g-2 mb-3">
        <div class="col-3"><div class="border rounded p-2"><div class="fw-bold fs-5">${s.totalCount}</div><small class="text-muted">总人数</small></div></div>
        <div class="col-3"><div class="border rounded p-2"><div class="fw-bold fs-5 text-success">${s.signedCount}</div><small class="text-muted">已签到</small></div></div>
        <div class="col-3"><div class="border rounded p-2"><div class="fw-bold fs-5 text-danger">${s.unsignedCount}</div><small class="text-muted">未签到</small></div></div>
        <div class="col-3"><div class="border rounded p-2"><div class="fw-bold fs-5 text-warning">${s.lateCount||0}</div><small class="text-muted">迟到</small></div></div>
    </div>
    <div class="row g-2"><div class="col"><div class="border rounded p-2"><div class="fw-bold text-success">${s.normalCount||0}</div><small class="text-muted">✅ 正常</small></div></div><div class="col"><div class="border rounded p-2"><div class="fw-bold text-warning">${s.lateCount||0}</div><small class="text-muted">⚠️ 迟到</small></div></div><div class="col"><div class="border rounded p-2"><div class="fw-bold text-primary">${s.leaveCount||0}</div><small class="text-muted">📝 请假</small></div></div><div class="col"><div class="border rounded p-2"><div class="fw-bold text-danger">${s.absentCount||0}</div><small class="text-muted">❌ 缺勤</small></div></div><div class="col"><div class="border rounded p-2"><div class="fw-bold text-info">${s.abnormalCount||0}</div><small class="text-muted">⚠️ 异常</small></div></div></div>
</div><div class="modal-footer"><button class="btn btn-gradient" data-bs-dismiss="modal">确定</button></div></div></div></div>`;
    const w=document.createElement('div');w.innerHTML=m;document.body.appendChild(w.firstElementChild);
    const modal=new bootstrap.Modal(document.body.lastElementChild);modal.show();
    modal._element.addEventListener('hidden.bs.modal',()=>modal._element.remove());
}

function leavePage(){
    if(refresh){clearInterval(refresh);refresh=null;}
    navigateTo('/teacher/courses.html');
}

// Start polling
load();
refresh=setInterval(load, 3000);
window.addEventListener('beforeunload',()=>{if(refresh)clearInterval(refresh);});
</script>
</body></html>
