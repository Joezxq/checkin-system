<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>数据看板</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="navbar-brand">📈 数据看板</span>
    <div class="d-flex gap-2">
        <div class="dropdown"><button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">📥 导出</button><ul class="dropdown-menu" id="exportMenu"><li><a class="dropdown-item" href="#" onclick="exportData('csv')">导出CSV</a></li><li><a class="dropdown-item" href="#" onclick="exportData('xlsx')">导出Excel</a></li></ul></div>
        <button class="btn btn-outline-secondary" onclick="navigateTo('/teacher/courses.html')">← 返回</button>
    </div>
</nav>

<div id="courseDash" class="text-center py-5"><div class="spinner-custom"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
const courseId=getUrlParam('courseId');
let chartInstances=[];

async function loadDashboard() {
    if(!courseId){document.getElementById('courseDash').innerHTML='<div class="alert alert-warning">缺少课程参数</div>';return;}
    try{
        const [dash,trend,dist]=await Promise.all([
            get(`/api/teacher/courses/${courseId}/dashboard`),
            get(`/api/teacher/courses/${courseId}/trend`),
            get(`/api/teacher/courses/${courseId}/distribution`)
        ]);
        renderDashboard(dash,trend,dist);
    }catch(e){
        if(e.message.includes('未登录'))navigateTo('/teacher/login.html');
        else showError(e.message);
    }
}

function renderDashboard(dash,trend,dist){
    const rc=dash.averageRate<60?'rate-low':dash.averageRate<80?'rate-medium':'rate-high';
    const html=`
    <h4 class="mb-3">📖 ${escapeHtml(dash.courseName)}</h4>
    <div class="row g-3 mb-3">
        <div class="col-6 col-md-2"><div class="stat-card text-center p-3"><div class="rate-circle ${rc} mx-auto mb-2"><span class="rate-num">${dash.averageRate}%</span><span class="rate-label">平均出勤率</span></div></div></div>
        <div class="col-6 col-md-2"><div class="stat-card text-center p-3"><div class="fs-4 fw-bold">${dash.totalSessions}</div><small class="text-muted">📋 签到次数</small></div></div>
        <div class="col-6 col-md-2"><div class="stat-card text-center p-3"><div class="fs-4 fw-bold">${dash.totalStudents}</div><small class="text-muted">👥 学生人数</small></div></div>
        <div class="col-6 col-md-2"><div class="stat-card text-center p-3" style="border-top:3px solid var(--success);"><div class="fs-4 fw-bold text-success">${dash.normalCount||0}</div><small class="text-muted">✅ 正常</small></div></div>
        <div class="col-6 col-md-2"><div class="stat-card text-center p-3" style="border-top:3px solid var(--danger);"><div class="fs-4 fw-bold text-danger">${dash.absentCount||0}</div><small class="text-muted">❌ 缺勤</small></div></div>
        <div class="col-6 col-md-2"><div class="stat-card text-center p-3" style="border-top:3px solid var(--primary);"><div class="fs-4 fw-bold">${dash.leaveCount||0}</div><small class="text-muted">📝 请假</small></div></div>
    </div>
    <div class="row g-3">
        <div class="col-md-6"><div class="glass-card"><h6 class="mb-3">📊 出勤趋势</h6><canvas id="trendChart" height="250"></canvas></div></div>
        <div class="col-md-6"><div class="glass-card"><h6 class="mb-3">🍩 状态分布</h6><canvas id="distChart" height="250"></canvas></div></div>
    </div>`;
    document.getElementById('courseDash').innerHTML=html;

    // 销毁旧图表
    chartInstances.forEach(c=>c.destroy());
    chartInstances=[];

    // 趋势图
    const dates=trend.map(t=>formatDate(t.date));
    const rates=trend.map(t=>t.attendanceRate);
    chartInstances.push(new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:dates,datasets:[{label:'出勤率 %',data:rates,borderColor:'#7c5cfc',backgroundColor:'rgba(124,92,252,0.1)',fill:true,tension:0.3}]},options:{responsive:true,scales:{y:{min:0,max:100}}}}));

    // 状态分布
    chartInstances.push(new Chart(document.getElementById('distChart'),{type:'doughnut',data:{labels:['正常','请假','缺勤','异常'],datasets:[{data:[dist.NORMAL||0,dist.LEAVE||0,dist.ABSENT||0,dist.ABNORMAL||0],backgroundColor:['#28a745','#7c5cfc','#dc3545','#17a2b8']}]},options:{responsive:true}}));
}

function exportData(format){
    window.open(`/api/teacher/export/course/${courseId}?format=${format}`);
}

loadDashboard();
</script>
</body></html>
