<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>考勤记录</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="navbar-brand">📋 考勤记录</span>
    <div class="d-flex gap-2"><select class="form-select form-select-sm" id="courseFilter" onchange="loadRecords()" style="width:200px;"><option value="">-- 选择课程 --</option></select><button class="btn btn-outline-secondary btn-sm" onclick="navigateTo('/teacher/courses.html')">← 返回</button></div>
</nav>
<div class="row g-2 mb-3" id="summaryRow"></div>
<div class="glass-card"><div id="recordTable" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
async function loadCourses(){try{const courses=await get('/api/teacher/courses');document.getElementById('courseFilter').innerHTML='<option value="">-- 选择课程 --</option>'+courses.map(c=>`<option value="${c.id}">${escapeHtml(c.courseName)}</option>`).join('');}catch(e){if(e.message.includes('未登录'))navigateTo('/teacher/login.html');}}

async function loadRecords(){
    const cid=document.getElementById('courseFilter').value;
    const el=document.getElementById('recordTable');
    if(!cid){el.innerHTML='<div class="text-center py-5 text-muted">📂 请选择课程</div>';document.getElementById('summaryRow').innerHTML='';return;}
    el.innerHTML='<div class="spinner-custom mx-auto"></div>';
    try{
        const [sessions,dashboard,students]=await Promise.all([
            get(`/api/teacher/courses/${cid}/statistics`),
            get(`/api/teacher/courses/${cid}/dashboard`),
            get(`/api/teacher/course/${cid}/students`)
        ]);
        // Risk data
        let riskMap={};
        try{const scores=await get(`/api/teacher/courses/${cid}/risk/scores`);(scores||[]).forEach(r=>{riskMap[r.studentId]=r;});}catch(e){}

        document.getElementById('summaryRow').innerHTML=`
            <div class="col-3"><div class="stat-card text-center p-2"><div class="fs-5 fw-bold">${students.length}</div><small class="text-muted">👥 学生</small></div></div>
            <div class="col-3"><div class="stat-card text-center p-2"><div class="fs-5 fw-bold">${dashboard.totalSessions}</div><small class="text-muted">📋 签到</small></div></div>
            <div class="col-3"><div class="stat-card text-center p-2"><div class="fs-5 fw-bold text-success">${dashboard.averageRate}%</div><small class="text-muted">📊 出勤率</small></div></div>
            <div class="col-3"><div class="stat-card text-center p-2"><div class="fs-5 fw-bold text-danger">${dashboard.absentCount||0}</div><small class="text-muted">❌ 缺勤</small></div></div>`;

        const sessList=(sessions.sessions||[]).sort((a,b)=>a.startTime>b.startTime?1:-1);
        const riskBadge=sid=>{const r=riskMap[sid];if(!r||r.riskLevel==='LOW')return'';return r.riskLevel==='HIGH'?' <span class="badge bg-danger" style="font-size:0.6rem;">📌多次缺勤</span>':'';};

        let html=`<h6 class="mb-3">📅 签到记录列表</h6>`;
        if(sessList.length===0){
            html+=`<div class="text-center py-3 text-muted">📭 暂无签到记录</div>`;
        }else{
            html+=`<div class="table-responsive"><table class="table table-hover table-sm"><thead><tr><th>标题</th><th>时间</th><th>状态</th><th>应到</th><th>实到</th><th>正常</th><th>请假</th><th>缺勤</th><th>签到率</th><th>操作</th></tr></thead><tbody>`;
            sessList.forEach(s=>{
                const d=s.startTime?formatDateTime(s.startTime):'';
                html+=`<tr>
                    <td class="fw-semibold">${escapeHtml(s.title||'签到')}</td>
                    <td class="text-muted small">${d}</td>
                    <td>${s.status==='IN_PROGRESS'?'<span class="badge bg-success">进行中</span>':'<span class="badge bg-secondary">已结束</span>'}</td>
                    <td>${s.totalCount}</td><td>${s.signedCount}</td>
                    <td class="text-success">${s.normalCount||0}</td>
                    <td class="text-primary">${s.leaveCount||0}</td>
                    <td class="text-danger">${s.absentCount||0}</td>
                    <td><strong>${s.attendanceRate}%</strong></td>
                    <td><button class="btn btn-sm btn-outline-primary" onclick="navigateTo('/teacher/realtime.html?sessionId=${s.sessionId}')">查看</button></td>
                </tr>`;
            });
            html+=`</tbody></table></div>`;
        }

        // Student summary
        html+=`<h6 class="mb-3 mt-4">👥 学生出勤汇总</h6>`;
        html+=`<div class="table-responsive"><table class="table table-hover table-sm"><thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>风险标记</th></tr></thead><tbody>`;
        students.forEach(s=>{
            html+=`<tr><td><small>${escapeHtml(s.studentNo)}</small></td><td class="fw-semibold">${escapeHtml(s.name)}${riskBadge(s.id)}</td><td><small class="text-muted">${escapeHtml(s.className||'')}</small></td><td>${riskBadge(s.id)}</td></tr>`;
        });
        html+=`</tbody></table></div>`;
        html+=`<small class="text-muted">💡 点击签到记录行的「查看」可进入实时签到页面查看详情。风险标记需先关闭签到并计算风险评分。</small>`;

        el.innerHTML=html;
    }catch(e){if(e.message.includes('未登录'))navigateTo('/teacher/login.html');else showError(e.message);}
}
loadCourses();
</script>
</body></html>
