<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>请假审批</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center">
    <span class="navbar-brand">📋 请假审批</span>
    <button class="btn btn-outline-secondary" onclick="navigateTo('/teacher/courses.html')">← 返回</button>
</nav>

<div class="mb-3"><label class="form-label">选择课程</label><select class="form-select" id="courseFilter" onchange="loadLeaves()"><option value="">-- 选择课程 --</option></select></div>

<div class="glass-card">
    <div id="leaveList" class="text-center py-4 text-muted"><div class="spinner-custom"></div></div>
</div>
</div>

<!-- Approve Modal -->
<div class="modal fade" id="approveModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title">审批请假</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
    <div id="approveStudentInfo" class="mb-3"></div>
    <div class="mb-3"><label class="form-label">审批意见（可选）</label><textarea class="form-control" id="approveComment" rows="2" maxlength="500" placeholder="输入审批意见..."></textarea></div>
</div>
<div class="modal-footer">
    <button class="btn btn-danger" id="rejectBtn">❌ 驳回</button>
    <button class="btn btn-gradient" id="approveBtn">✅ 通过</button>
</div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
let currentLeaveId = null;
const approveModal = new bootstrap.Modal(document.getElementById('approveModal'));

// 加载课程
async function loadCourses() {
    try {
        const courses = await get('/api/teacher/courses');
        const sel = document.getElementById('courseFilter');
        sel.innerHTML = '<option value="">-- 选择课程 --</option>' + courses.map(c =>
            `<option value="${c.id}">${escapeHtml(c.courseName)}</option>`
        ).join('');
    } catch(e) {
        if(e.message.includes('未登录')) navigateTo('/teacher/login.html');
    }
}

// 加载请假列表
async function loadLeaves() {
    const courseId = document.getElementById('courseFilter').value;
    const el = document.getElementById('leaveList');
    if(!courseId) { el.innerHTML='<div class="text-center py-5 text-muted">📂 请选择课程查看请假申请</div>'; return; }
    el.innerHTML = '<div class="text-center py-4"><div class="spinner-custom"></div></div>';
    try {
        const leaves = await get(`/api/teacher/courses/${courseId}/leaves`);
        if(!leaves || leaves.length === 0) {
            el.innerHTML = '<div class="text-center py-5 text-muted">📭 暂无请假申请</div>';
            return;
        }
        const statusBadge = s => s==='PENDING'?'<span class="badge bg-warning text-dark">待审核</span>'
            :s==='APPROVED'?'<span class="badge bg-success">已通过</span>'
            :'<span class="badge bg-danger">已驳回</span>';
        const typeName = t => ({PERSONAL:'事假',SICK:'病假',OTHER:'其他'}[t]||t);
        el.innerHTML = `<div class="table-responsive"><table class="table table-hover">
            <thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>类型</th><th>原因</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
            <tbody>${leaves.map(l => `<tr>
                <td><small>${escapeHtml(l.studentNo||'-')}</small></td>
                <td>${escapeHtml(l.studentName||'学生'+l.studentId)}</td>
                <td><small>${escapeHtml(l.className||'-')}</small></td>
                <td>${typeName(l.leaveType)}</td>
                <td><small>${escapeHtml(l.reason)}</small></td>
                <td>${statusBadge(l.status)}</td>
                <td class="text-muted small">${formatDateTime(l.createdAt)}</td>
                <td>${l.status==='PENDING' ? `<div class="d-flex gap-1">
                    <button class="btn btn-sm btn-success" onclick="openApprove(${l.id},'${escapeHtml(l.studentName||'学生')}','${escapeHtml(l.studentNo||'-')}','${escapeHtml(l.reason)}')">✓</button>
                    <button class="btn btn-sm btn-danger" onclick="rejectLeave(${l.id})">✗</button>
                </div>` : `<small class="text-muted">${l.teacherComment||'-'}</small>`}</td>
            </tr>`).join('')}</tbody></table></div>`;
    } catch(e) { showError(e.message); }
}

function openApprove(id, name, no, reason) {
    currentLeaveId = id;
    document.getElementById('approveStudentInfo').innerHTML = `<div class="p-2 bg-light rounded"><strong>${escapeHtml(name)}</strong> (${escapeHtml(no)})<br><small class="text-muted">${escapeHtml(reason)}</small></div>`;
    document.getElementById('approveComment').value = '';
    approveModal.show();
}

document.getElementById('approveBtn').addEventListener('click', async () => {
    if(!currentLeaveId) return;
    const comment = document.getElementById('approveComment').value.trim();
    try {
        await post(`/api/teacher/leaves/${currentLeaveId}/approve`, {comment});
        approveModal.hide();
        showToast('请假已通过', 'success');
        loadLeaves();
    } catch(e) { showError(e.message); }
});

document.getElementById('rejectBtn').addEventListener('click', async () => {
    if(!currentLeaveId) return;
    const comment = document.getElementById('approveComment').value.trim();
    if(!comment) { showError('驳回时请填写审批意见'); return; }
    try {
        await post(`/api/teacher/leaves/${currentLeaveId}/reject`, {comment});
        approveModal.hide();
        showToast('请假已驳回', 'info');
        loadLeaves();
    } catch(e) { showError(e.message); }
});

async function rejectLeave(id) {
    currentLeaveId = id;
    document.getElementById('approveComment').value = '';
    document.getElementById('approveStudentInfo').innerHTML = '<p>请输入驳回理由后点击驳回按钮</p>';
    approveModal.show();
}

loadCourses();
</script>
</body></html>
