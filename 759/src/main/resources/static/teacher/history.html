<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>历史记录</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2"><span class="navbar-brand">📋 历史记录</span><button class="btn btn-outline-secondary" onclick="navigateTo('/teacher/courses.html')">← 返回</button></nav>
<div class="glass-card mb-3"><div class="row g-3"><div class="col-md-4"><label class="form-label">课程</label><select class="form-select" id="courseSelect" onchange="loadHistory()"><option value="">全部</option></select></div><div class="col-md-3"><label class="form-label">开始</label><input type="date" class="form-control" id="dateFrom" onchange="loadHistory()"></div><div class="col-md-3"><label class="form-label">结束</label><input type="date" class="form-control" id="dateTo" onchange="loadHistory()"></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-outline-primary w-100" id="statsBtn" disabled onclick="showCourseStats()">📊 统计</button></div></div></div>
<div class="glass-card"><div id="historyList" class="text-center py-5"><div class="spinner-custom"></div></div><div id="pagination" class="d-flex justify-content-center gap-2 mt-3"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
let page=0,cnMap={};const SIZE=10;
async function loadCourses(){try{const c=await get('/api/teacher/courses');cnMap={};c.forEach(x=>cnMap[x.id]=x.courseName);document.getElementById('courseSelect').innerHTML='<option value="">全部课程</option>'+c.map(x=>`<option value="${x.id}">${escapeHtml(x.courseName)}</option>`).join('');}catch(e){}}
function rateBadge(r){if(r==null)return'<span class="badge bg-secondary">-</span>';const c=r>=80?'success':r>=60?'warning':'danger';return`<span class="badge bg-${c}">${r}%</span>`;}
async function loadHistory(p=0){const cid=document.getElementById('courseSelect').value;const df=document.getElementById('dateFrom').value;const dt=document.getElementById('dateTo').value;let url=`/api/teacher/sessions/history?page=${p}&size=${SIZE}`;if(cid)url+=`&courseId=${cid}`;if(df)url+=`&dateFrom=${df}`;if(dt)url+=`&dateTo=${dt}`;try{const d=await get(url);const sb=document.getElementById('statsBtn');if(cid){sb.disabled=false;sb.onclick=()=>showCourseStats(cid);}else sb.disabled=true;const el=document.getElementById('historyList');if(d.content.length===0){el.innerHTML='<div class="text-center py-5 text-muted">📭 暂无记录</div>';document.getElementById('pagination').innerHTML='';return;}el.innerHTML=`<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>课程</th><th>开始时间</th><th>结束</th><th>状态</th><th>应到</th><th>实到</th><th>签到率</th><th class="text-end">操作</th></tr></thead><tbody>${d.content.map(s=>`<tr><td class="fw-semibold">${escapeHtml(cnMap[s.courseId]||'课程'+s.courseId)}</td><td class="text-muted small">${formatDateTime(s.startTime)}</td><td class="text-muted small">${s.endTime?formatDateTime(s.endTime):'-'}</td><td>${s.status==='IN_PROGRESS'?'<span class="badge bg-success">进行中</span>':'<span class="badge bg-secondary">已结束</span>'}</td><td>${s.totalCount!=null?s.totalCount:'-'}</td><td>${s.signedCount!=null?s.signedCount:'-'}</td><td>${rateBadge(s.attendanceRate)}</td><td class="text-end"><button class="btn btn-outline-primary" onclick="navigateTo('/teacher/realtime.html?sessionId='+${s.id})">查看</button></td></tr>`).join('')}</tbody></table></div>`;document.getElementById('pagination').innerHTML=`<button class="btn btn-outline-secondary" ${p===0?'disabled':''} onclick="loadHistory(${p-1})">上一页</button><span class="align-self-center text-muted">${p+1}/${d.totalPages}</span><button class="btn btn-outline-secondary" ${p>=d.totalPages-1?'disabled':''} onclick="loadHistory(${p+1})">下一页</button>`;page=p;}catch(e){if(e.message.includes('未登录'))navigateTo('/teacher/login.html');else showError(e.message);}}
async function showCourseStats(cid){if(!cid)cid=document.getElementById('courseSelect').value;if(!cid){showInfo('请选择课程');return;}try{const s=await get(`/api/teacher/courses/${cid}/statistics`);const rc=s.averageRate<60?'rate-low':s.averageRate<80?'rate-medium':'rate-high';const rows=s.sessions.map(x=>`<tr><td class="text-muted small">${formatDateTime(x.startTime)}</td><td>${x.status==='IN_PROGRESS'?'进行中':'已结束'}</td><td>${x.totalCount}</td><td>${x.signedCount}</td><td>${rateBadge(x.attendanceRate)}</td></tr>`).join('');const m=`<div class="modal fade" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5>📊 ${escapeHtml(s.courseName)} 统计</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="text-center mb-4"><div class="rate-circle ${rc} mx-auto mb-2"><span class="rate-num">${s.averageRate}%</span><span class="rate-label">平均签到率</span></div><p class="text-muted">共${s.totalSessions}次活动</p></div><div class="table-responsive"><table class="table table-sm"><thead><tr><th>时间</th><th>状态</th><th>应到</th><th>实到</th><th>率</th></tr></thead><tbody>${rows||'<tr><td colspan="5" class="text-center text-muted">无数据</td></tr>'}</tbody></table></div></div><div class="modal-footer"><button class="btn btn-gradient" data-bs-dismiss="modal">关闭</button></div></div></div></div>`;const w=document.createElement('div');w.innerHTML=m;document.body.appendChild(w.firstElementChild);const modal=new bootstrap.Modal(document.body.lastElementChild);modal.show();modal._element.addEventListener('hidden.bs.modal',()=>modal._element.remove());}catch(e){showError(e.message);}}
loadCourses();loadHistory();
</script>
</body></html>
