<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>课程管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="navbar-brand">📖 课程管理</span>
    <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-gradient" onclick="showCourseModal()">+ 创建课程</button>
        <button class="btn btn-outline-secondary" onclick="navigateTo('/teacher/students.html')">学生管理</button>
        <button class="btn btn-outline-warning" onclick="navigateTo('/teacher/leaves.html')">请假审批</button>
        <button class="btn btn-outline-secondary" onclick="navigateTo('/teacher/history.html')">历史记录</button>
        <button class="btn btn-outline-danger" onclick="logout()">退出</button>
    </div>
</nav>
<div class="glass-card"><div id="courseList" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
let sessionMap={};
async function loadAll(){try{const courses=await get('/api/teacher/courses');sessionMap={};await Promise.all(courses.map(async c=>{try{const s=await get(`/api/teacher/course/${c.id}/active-session`);if(s)sessionMap[c.id]=s;}catch(e){}}));render(courses);}catch(e){if(e.message.includes('未登录'))navigateTo('/teacher/login.html');else showError(e.message);}}
function render(courses){const el=document.getElementById('courseList');if(courses.length===0){el.innerHTML='<div class="text-center py-5 text-muted">📭 暂无课程</div>';return;}el.innerHTML=`<div class="table-responsive"><table class="table table-hover align-middle"><thead class="table-light"><tr><th>课程名称</th><th>签到状态</th><th>创建时间</th><th class="text-end">操作</th></tr></thead><tbody>${courses.map(c=>{const a=sessionMap[c.id];const st=a?`<span class="badge bg-success">● 进行中</span><br><small class="text-muted">${a.endTime?formatDateTime(a.endTime).slice(11,19):''}截止</small>`:'<span class="badge bg-secondary">○ 无活动</span>';const btn=a?`<button class="btn btn-outline-success me-1" onclick="navigateTo('/teacher/realtime.html?sessionId=${a.id}')">📊 实时</button><button class="btn btn-outline-danger me-1" onclick="closeSession(${a.id})">⏹ 关闭</button>`:`<button class="btn btn-success me-1" onclick="openSessionDialog(${c.id})">📋 发起签到</button>`;return`<tr><td class="fw-bold">${escapeHtml(c.courseName)}</td><td>${st}</td><td class="text-muted small">${formatDateTime(c.createdAt)}</td><td class="text-end">${btn}<button class="btn btn-outline-primary me-1" onclick="navigateTo('/teacher/course-students.html?courseId=${c.id}')">👥</button><button class="btn btn-outline-info me-1" onclick="navigateTo('/teacher/dashboard.html?courseId=${c.id}')">📈</button><button class="btn btn-outline-secondary me-1" onclick="editCourse(${c.id},'${escapeHtml(c.courseName).replace(/'/g,"\\'")}')">✏️</button><button class="btn btn-outline-danger" onclick="deleteCourse(${c.id})">🗑</button></td></tr>`}).join('')}</tbody></table></div>`;}
function showCourseModal(course){const isEdit=!!course;const t=isEdit?'编辑课程':'创建课程';const v=isEdit?` value="${escapeHtml(course.courseName)}"`:'';const m=`<div class="modal fade" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5>${t}</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label>课程名称</label><input class="form-control" id="cName"${v}></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-gradient" id="saveBtn">保存</button></div></div></div></div>`;const w=document.createElement('div');w.innerHTML=m;document.body.appendChild(w.firstElementChild);const modal=new bootstrap.Modal(document.body.lastElementChild);modal.show();modal._element.addEventListener('hidden.bs.modal',()=>modal._element.remove());document.getElementById('saveBtn').onclick=async()=>{const n=document.getElementById('cName').value.trim();if(!n){showError('请输入名称');return;}try{if(isEdit)await put(`/api/teacher/courses/${course.id}`,{courseName:n});else await post('/api/teacher/courses',{courseName:n});modal.hide();showSuccess(isEdit?'已更新':'已创建');loadAll();}catch(e){showError(e.message);}};}
function editCourse(id,n){showCourseModal({id,courseName:n});}
function openSessionDialog(cid){const m=`<div class="modal fade" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5>📋 发起签到</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label>签到标题</label><input class="form-control" id="sTitle" placeholder="例如：第3周签到"></div><div class="mb-3"><label>正常签到时长（分钟）</label><input class="form-control" id="sDuration" type="number" value="10" min="1" max="180"></div><div class="mb-3"><label>迟到宽限时间（分钟，0=不允许迟到）</label><input class="form-control" id="sLate" type="number" value="5" min="0" max="60"></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-gradient" id="openBtn">发起</button></div></div></div></div>`;const w=document.createElement('div');w.innerHTML=m;document.body.appendChild(w.firstElementChild);const modal=new bootstrap.Modal(document.body.lastElementChild);modal.show();modal._element.addEventListener('hidden.bs.modal',()=>modal._element.remove());document.getElementById('openBtn').onclick=async()=>{const title=document.getElementById('sTitle').value.trim()||null;const dur=parseInt(document.getElementById('sDuration').value)||10;const late=parseInt(document.getElementById('sLate').value)||0;try{const s=await post(`/api/teacher/course/${cid}/sessions/open`,{title,durationMinutes:dur,normalEndTimeMinutes:dur,lateEndTimeMinutes:late,allowLate:late>0});showSuccess('签到已发起');navigateTo(`/teacher/realtime.html?sessionId=${s.id}`);}catch(e){showError(e.message);}};}
async function closeSession(sid){showConfirm('关闭签到','确定关闭吗？',async()=>{try{await post(`/api/teacher/sessions/${sid}/close`);showSuccess('已关闭');loadAll();}catch(e){showError(e.message);}});}
async function deleteCourse(id){showConfirm('删除课程','确定删除？不可恢复。',async()=>{try{await del(`/api/teacher/courses/${id}`);showSuccess('已删除');loadAll();}catch(e){showError(e.message);}});}
loadAll();
</script>
</body></html>
