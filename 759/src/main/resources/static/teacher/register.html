<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>教师注册</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body>
<div class="d-flex align-items-center justify-content-center min-vh-100" style="position:relative;z-index:1;">
    <div class="glass-card login-card">
        <h3 class="text-center mb-4 fw-bold" style="background:linear-gradient(135deg,#7c5cfc,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">📝 教师注册</h3>
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="mb-3"><label class="form-label">工号</label><input class="form-control" name="teacherNo" required placeholder="例如：T010"></div>
            <div class="mb-3"><label class="form-label">姓名</label><input class="form-control" name="name" required placeholder="请输入姓名"></div>
            <div class="mb-3"><label class="form-label">密码</label><input type="password" class="form-control" name="password" required placeholder="至少6位" minlength="6"></div>
            <div class="mb-3"><label class="form-label">确认密码</label><input type="password" class="form-control" name="confirmPassword" required placeholder="再次输入"></div>
            <div id="formError" class="alert alert-danger d-none"></div>
            <button type="submit" class="btn btn-gradient w-100 py-2 fs-6">注 册</button>
        </form>
        <div class="text-center mt-3"><span class="text-muted">已有账号？</span><a href="/teacher/login.html" class="text-decoration-none" style="color:var(--accent);">立即登录</a></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>async function handleRegister(e){e.preventDefault();const err=document.getElementById('formError');err.classList.add('d-none');const f=document.getElementById('registerForm');if(f.password.value!==f.confirmPassword.value){err.textContent='两次密码不一致';err.classList.remove('d-none');return;}if(f.password.value.length<6){err.textContent='密码长度不能少于6位';err.classList.remove('d-none');return;}try{await post('/api/auth/teacher/register',{teacherNo:f.teacherNo.value.trim(),name:f.name.value.trim(),password:f.password.value,confirmPassword:f.confirmPassword.value});navigateTo('/teacher/courses.html');}catch(e){err.textContent=e.message;err.classList.remove('d-none');}}</script>
</body>
</html>
