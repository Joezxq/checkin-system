<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>学生管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="navbar-brand">👥 学生管理</span>
    <div class="d-flex gap-2">
        <button class="btn btn-gradient" onclick="showStudentModal()">+ 添加</button>
        <button class="btn btn-outline-primary" onclick="showBatchImport()">📄 批量导入</button>
        <button class="btn btn-outline-secondary" onclick="navigateTo('/teacher/courses.html')">← 返回</button>
    </div>
</nav>
<div class="glass-card">
    <div class="row g-2 mb-3"><div class="col-md-6"><input class="form-control" id="search" placeholder="🔍 搜索学号或姓名"></div><div class="col-md-3"><select class="form-select" id="classFilter"><option value="">全部班级</option></select></div></div>
    <div id="studentList" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div>
    <div id="pagination" class="d-flex justify-content-center gap-2 mt-3"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
let page=0;const SIZE=10;
async function loadClasses(){try{const c=await get('/api/teacher/students/classes');const s=document.getElementById('classFilter');s.innerHTML='<option value="">全部班级</option>'+c.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');}catch(e){}}
async function loadStudents(p=0){const kw=document.getElementById('search').value;const cn=document.getElementById('classFilter').value;let url=`/api/teacher/students?page=${p}&size=${SIZE}`;if(kw)url+=`&keyword=${encodeURIComponent(kw)}`;if(cn)url+=`&className=${encodeURIComponent(cn)}`;try{const d=await get(url);const el=document.getElementById('studentList');if(d.content.length===0){el.innerHTML='<div class="text-center py-5 text-muted">📭 暂无学生</div>';document.getElementById('pagination').innerHTML='';return;}el.innerHTML=`<div class="table-responsive"><table class="table table-hover align-middle"><thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>时间</th><th class="text-end">操作</th></tr></thead><tbody>${d.content.map(s=>`<tr><td>${escapeHtml(s.studentNo)}</td><td class="fw-semibold">${escapeHtml(s.name)}</td><td>${escapeHtml(s.className)||'-'}</td><td class="text-muted small">${formatDateTime(s.createdAt)}</td><td class="text-end"><button class="btn btn-outline-primary me-1" onclick="editStudent(${s.id})">编辑</button><button class="btn btn-outline-danger" onclick="deleteStudent(${s.id})">删除</button></td></tr>`).join('')}</tbody></table></div>`;document.getElementById('pagination').innerHTML=`<button class="btn btn-outline-secondary" ${p===0?'disabled':''} onclick="loadStudents(${p-1})">上一页</button><span class="align-self-center text-muted">${p+1}/${d.totalPages}</span><button class="btn btn-outline-secondary" ${p>=d.totalPages-1?'disabled':''} onclick="loadStudents(${p+1})">下一页</button>`;page=p;}catch(e){if(e.message.includes('未登录'))navigateTo('/teacher/login.html');else showError(e.message);}}
const searchStudents=debounce(()=>loadStudents(0),300);
document.getElementById('search').oninput=searchStudents;
document.getElementById('classFilter').onchange=()=>loadStudents(0);
function showStudentModal(s){const isEdit=!!s;const m=`<div class="modal fade" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5>${isEdit?'编辑学生':'添加学生'}</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label>学号</label><input class="form-control" id="sNo" ${isEdit?'disabled':''} value="${escapeHtml(isEdit?s.studentNo:'')}"></div><div class="mb-3"><label>姓名</label><input class="form-control" id="sName" value="${escapeHtml(isEdit?s.name:'')}"></div><div class="mb-3"><label>密码 ${isEdit?'<small>(留空不修改)</small>':''}</label><input type="password" class="form-control" id="sPwd" placeholder="${isEdit?'留空':'默认123456'}"></div><div class="mb-3"><label>班级</label><input class="form-control" id="sClass" value="${escapeHtml(isEdit&&s.className?s.className:'')}"></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-gradient" id="saveBtn">保存</button></div></div></div></div>`;const w=document.createElement('div');w.innerHTML=m;document.body.appendChild(w.firstElementChild);const modal=new bootstrap.Modal(document.body.lastElementChild);modal.show();modal._element.addEventListener('hidden.bs.modal',()=>modal._element.remove());document.getElementById('saveBtn').onclick=async()=>{const no=document.getElementById('sNo').value.trim(),name=document.getElementById('sName').value.trim();const pwd=document.getElementById('sPwd').value,cls=document.getElementById('sClass').value.trim();if(!no||!name){showError('学号和姓名不能为空');return;}try{if(isEdit){const d={name,className:cls};if(pwd)d.password=pwd;await put(`/api/teacher/students/${s.id}`,d);}else await post('/api/teacher/students',{studentNo:no,name,password:pwd||'123456',className:cls});modal.hide();showSuccess(isEdit?'已更新':'已添加');loadStudents(page);loadClasses();}catch(e){showError(e.message);}};}
function editStudent(id){get(`/api/teacher/students/${id}`).then(showStudentModal).catch(e=>showError(e.message));}
async function deleteStudent(id){showConfirm('删除学生','确定删除？',async()=>{try{await del(`/api/teacher/students/${id}`);showSuccess('已删除');loadStudents(page);}catch(e){showError(e.message);}});}
function showBatchImport(){const m=`<div class="modal fade" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5>📄 CSV批量导入</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><p class="text-muted small">每行：<code>学号,姓名,班级</code></p><textarea class="form-control mb-3" id="csv" rows="8" placeholder="2021001,张三,计算机2101班&#10;2021002,李四,计算机2102班"></textarea><div id="csvPreview" class="d-none"><h6>预览 <span id="csvCount" class="badge bg-primary"></span></h6><div class="table-responsive" style="max-height:200px;overflow-y:auto;"><table class="table table-sm"><thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>状态</th></tr></thead><tbody id="csvRows"></tbody></table></div></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-outline-primary" onclick="parseCSV()">解析预览</button><button class="btn btn-gradient d-none" id="csvImportBtn" onclick="doImport()">确认导入</button></div></div></div></div>`;const w=document.createElement('div');w.innerHTML=m;document.body.appendChild(w.firstElementChild);const modal=new bootstrap.Modal(document.body.lastElementChild);modal.show();modal._element.addEventListener('hidden.bs.modal',()=>modal._element.remove());window._csvModal=modal;}
function parseCSV(){const t=document.getElementById('csv').value.trim();if(!t){showError('请输入数据');return;}const rs=[];t.split('\n').filter(l=>l.trim()).forEach(l=>{const p=l.split(/[,\t]/).map(x=>x.trim());if(p.length<2){rs.push({no:p[0]||'',name:'',cls:'',ok:false,reason:'格式错误'});return;}rs.push({no:p[0],name:p[1],cls:p[2]||'',ok:true});});document.getElementById('csvPreview').classList.remove('d-none');document.getElementById('csvCount').textContent=`${rs.filter(r=>r.ok).length}/${rs.length} 有效`;document.getElementById('csvRows').innerHTML=rs.map(r=>`<tr class="${r.ok?'':'table-danger'}"><td>${escapeHtml(r.no)}</td><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.cls)}</td><td>${r.ok?'✅':'❌ '+r.reason}</td></tr>`).join('');if(rs.some(r=>r.ok)){document.getElementById('csvImportBtn').classList.remove('d-none');window._csvData=rs.filter(r=>r.ok);}}
async function doImport(){const s=window._csvData.map(r=>({studentNo:r.no,name:r.name,className:r.cls}));try{const r=await post('/api/teacher/students/batch',{students:s});bootstrap.Modal.getInstance(document.querySelector('.modal.show')).hide();showSuccess(`导入完成：成功${r.successCount}个`);if(r.failCount>0)showError(r.errors.map(e=>`第${e.row}行:${e.reason}`).join('\\n'));loadStudents(0);loadClasses();}catch(e){showError(e.message);}}
loadClasses();loadStudents();
</script>
</body></html>
