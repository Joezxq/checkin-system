<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>教师登录</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body>
<div class="d-flex align-items-center justify-content-center min-vh-100" style="position:relative;z-index:1;">
    <div class="glass-card login-card">
        <h3 class="text-center mb-4 fw-bold" style="background:linear-gradient(135deg,#7c5cfc,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">👨‍🏫 教师登录</h3>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3"><label class="form-label">工号</label><input class="form-control" name="teacherNo" required placeholder="请输入工号"></div>
            <div class="mb-3"><label class="form-label">密码</label><input type="password" class="form-control" name="password" required placeholder="请输入密码"></div>
            <button type="submit" class="btn btn-gradient w-100 py-2 fs-6">登 录</button>
        </form>
        <div class="text-center mt-3"><a href="/teacher/register.html" class="text-decoration-none" style="color:var(--accent);">📝 注册教师账号</a><span class="text-muted mx-2">|</span><a href="/student/login.html" class="text-muted text-decoration-none">学生登录</a></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>async function handleLogin(e){e.preventDefault();try{await post('/api/auth/teacher/login',{teacherNo:document.getElementById('loginForm').teacherNo.value,password:document.getElementById('loginForm').password.value});navigateTo('/teacher/courses.html');}catch(e){showError(e.message);}}</script>
</body>
</html>
