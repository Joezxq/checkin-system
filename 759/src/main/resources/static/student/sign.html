<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>课程签到</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center"><span class="navbar-brand">📍 课程签到</span><button class="btn btn-outline-secondary" onclick="navigateTo('/student/courses.html')">← 返回</button></nav>
<div class="glass-card">
<ul class="nav nav-tabs mb-4"><li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#manualTab">🖐 手动签到</a></li><li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#qrTab">📱 扫码签到</a></li></ul>
<div class="tab-content">
<div class="tab-pane fade show active" id="manualTab"><div id="content" class="text-center py-5"><div class="spinner-custom"></div></div></div>
<div class="tab-pane fade" id="qrTab">
    <div class="text-center py-4"><p class="text-muted mb-3">扫描教师屏幕上的二维码，或粘贴 QR 码文本</p>
    <div class="mb-3"><input type="text" id="qrInput" class="form-control" placeholder="粘贴 QR 码文本" style="max-width:400px;margin:0 auto;"></div>
    <button class="btn btn-gradient px-4" onclick="qrSignIn()">确认签到</button><div id="qrError" class="alert alert-danger mt-3 d-none" style="max-width:400px;margin:0 auto;"></div></div>
</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
const courseId=getUrlParam('courseId');let activeSessionId=null;
async function checkSession(){try{const session=await get(`/api/student/course/${courseId}/active-session`);const el=document.getElementById('content');if(!session){el.innerHTML='<div class="alert alert-info text-center">📭 当前暂无签到活动</div>';return;}activeSessionId=session.id;const check=await get(`/api/student/session/${session.id}/check`);const hasSigned=check.hasSigned;
const normalEnd=session.normalEndTime?formatDateTime(session.normalEndTime):null;
const lateEnd=session.lateEndTime?formatDateTime(session.lateEndTime):null;
const titleHtml=session.title?`<div class="badge bg-light text-dark mb-2 fs-6">${escapeHtml(session.title)}</div><br>`:'';
const timeHtml=`<div class="d-flex flex-column align-items-center gap-1 mb-3 text-muted small">
    <span>⏰ 开始: ${formatDateTime(session.startTime)}</span>
    ${normalEnd?`<span>✅ 正常截止: ${normalEnd}</span>`:''}
    ${lateEnd?`<span class="text-warning">⚠️ 迟到截止: ${lateEnd}</span>`:''}
</div>`;
if(hasSigned){
    el.innerHTML=`<h5 class="mb-3">📋 签到进行中</h5>${titleHtml}${timeHtml}<button class="btn btn-success sign-btn mx-auto my-3" disabled><span class="fs-3">✓</span><br>已签到</button><p class="text-success mt-2">您已完成签到</p>`;
}else{
    el.innerHTML=`<h5 class="mb-3">📋 签到进行中</h5>${titleHtml}${timeHtml}<button class="btn btn-success sign-btn mx-auto my-3 py-0" onclick="signIn(${session.id})">点击<br>签到</button>`;
}}catch(e){if(e.message.includes('未登录'))navigateTo('/student/login.html');else showError(e.message);}}
async function signIn(id){try{await post(`/api/student/session/${id}/sign`);showSuccess('签到成功！');setTimeout(checkSession,1000);}catch(e){showError(e.message);}}
async function qrSignIn(sid,token){if(!sid)sid=activeSessionId;const input=document.getElementById('qrInput').value.trim();const errEl=document.getElementById('qrError');errEl.classList.add('d-none');
    if(!token){const t=input;if(!t){errEl.textContent='请输入QR码文本';errEl.classList.remove('d-none');return;}
    // 支持两种格式: 旧格式 CHECKIN:sid:token  新格式 URL参数 ?sid=X&token=Y
    if(t.startsWith('CHECKIN:')){const parts=t.split(':');if(parts.length<3){errEl.textContent='无效的QR码格式';errEl.classList.remove('d-none');return;}sid=parts[1];token=parts.slice(2).join(':');}
    else if(t.includes('sid=')&&t.includes('token=')){const u=new URL(t);sid=u.searchParams.get('sid');token=u.searchParams.get('token');}
    else{errEl.textContent='无效的QR码格式';errEl.classList.remove('d-none');return;}}
    try{await post(`/api/student/session/${sid}/qrsign`,{token});showSuccess('扫码签到成功！');document.getElementById('qrInput').value='';window._autoSigned=true;setTimeout(checkSession,500);}
    catch(e){errEl.textContent=e.message;errEl.classList.remove('d-none');}}
// 自动检测URL参数：学生扫码打开页面时自动完成签到
(function autoQR(){
    const sid=getUrlParam('sid');
    const token=getUrlParam('token');
    if(sid&&token){
        document.getElementById('qrInput').value='CHECKIN:'+sid+':'+token;
        // 等待页面加载完成后自动提交
        setTimeout(()=>{if(!window._autoSigned)qrSignIn(sid,token);},1500);
    }
})();
checkSession();
</script>
</body></html>
