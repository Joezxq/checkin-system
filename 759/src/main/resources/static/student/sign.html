<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>课程签到</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center"><span class="navbar-brand">📍 课程签到</span><button class="btn btn-outline-secondary" onclick="navigateTo('/student/courses.html')">← 返回</button></nav>
<div class="glass-card">
<ul class="nav nav-tabs mb-4"><li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#manualTab">🖐 手动签到</a></li><li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#qrTab">📱 扫码签到</a></li></ul>
<div class="tab-content">
<div class="tab-pane fade show active" id="manualTab"><div id="content" class="text-center py-5"><div class="spinner-custom"></div></div></div>
<div class="tab-pane fade" id="qrTab">
    <div class="text-center py-4"><p class="text-muted mb-3">扫描教师屏幕上的二维码，或粘贴 QR 码文本</p>
    <div class="mb-3"><input type="text" id="qrInput" class="form-control" placeholder="粘贴 QR 码文本" style="max-width:400px;margin:0 auto;"></div>
    <button class="btn btn-gradient px-4" onclick="qrSignIn()">确认签到</button><div id="qrError" class="alert alert-danger mt-3 d-none" style="max-width:400px;margin:0 auto;"></div></div>
</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
const courseId=getUrlParam('courseId');let activeSessionId=null;
async function checkSession(){try{const session=await get(`/api/student/course/${courseId}/active-session`);const el=document.getElementById('content');if(!session){el.innerHTML='<div class="alert alert-info text-center">📭 当前暂无签到活动</div>';return;}activeSessionId=session.id;const check=await get(`/api/student/session/${session.id}/check`);const hasSigned=check.hasSigned;el.innerHTML=`<h5 class="mb-3">📋 签到进行中</h5><div class="d-flex justify-content-center gap-4 mb-4 text-muted small"><span>${formatDateTime(session.startTime)}</span><span>→ ${session.endTime?formatDateTime(session.endTime):'--'}</span></div>${hasSigned?'<button class="btn btn-success sign-btn mx-auto my-3" disabled><span class="fs-3">✓</span><br>已签到</button><p class="text-success mt-2">您已完成签到</p>':'<button class="btn btn-success sign-btn mx-auto my-3 py-0" onclick="signIn('+session.id+')">点击<br>签到</button>'}`;}catch(e){if(e.message.includes('未登录'))navigateTo('/student/login.html');else showError(e.message);}}
async function signIn(id){try{await post(`/api/student/session/${id}/sign`);showSuccess('签到成功！');setTimeout(checkSession,1000);}catch(e){showError(e.message);}}
async function qrSignIn(){const input=document.getElementById('qrInput').value.trim();const errEl=document.getElementById('qrError');errEl.classList.add('d-none');if(!input){errEl.textContent='请输入QR码文本';errEl.classList.remove('d-none');return;}const parts=input.split(':');if(parts.length<3||parts[0]!=='CHECKIN'){errEl.textContent='无效的QR码格式';errEl.classList.remove('d-none');return;}const sid=parts[1];const token=parts.slice(2).join(':');try{const result=await post(`/api/student/session/${sid}/qrsign`,{token});showSuccess('扫码签到成功！');document.getElementById('qrInput').value='';if(sid==activeSessionId)setTimeout(checkSession,1000);}catch(e){errEl.textContent=e.message;errEl.classList.remove('d-none');}}
checkSession();
</script>
</body></html>
