<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>我的课程</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center"><span class="navbar-brand">📚 我的课程</span><button class="btn btn-outline-secondary" onclick="logout()">退出</button></nav>
<div class="glass-card"><div id="courseList" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
async function loadCourses(){try{const courses=await get('/api/student/courses');const el=document.getElementById('courseList');if(courses.length===0){el.innerHTML='<div class="text-center py-5 text-muted">📭 暂无课程</div>';return;}const statuses={};await Promise.all(courses.map(async c=>{try{const s=await get(`/api/student/course/${c.id}/active-session`);statuses[c.id]=!!s;}catch(e){}}));el.innerHTML='<div class="row row-cols-1 row-cols-md-3 g-4">'+courses.map(c=>`<div class="col"><div class="course-card h-100 d-flex flex-column justify-content-center" onclick="navigateTo('/student/sign.html?courseId='+${c.id})"><div class="course-name mb-2">${escapeHtml(c.courseName)}${statuses[c.id]?' <span class="badge bg-success" style="animation:pulse-glow 2s infinite;">● 签到中</span>':''}</div><small class="text-muted">点击进入签到</small></div></div>`).join('')+'</div>';}catch(e){if(e.message.includes('未登录'))navigateTo('/student/login.html');else showError(e.message);}}loadCourses();
</script>
</body></html>
