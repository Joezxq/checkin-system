<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>请假管理</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center">
    <span class="navbar-brand">📝 请假管理</span>
    <button class="btn btn-outline-secondary" onclick="navigateTo('/student/courses.html')">← 返回</button>
</nav>

<ul class="nav nav-tabs mb-3" id="leaveTab" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#applyTab">📋 申请请假</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#historyTab">📜 请假记录</button></li>
</ul>

<div class="tab-content">
    <!-- 申请请假 -->
    <div class="tab-pane fade show active" id="applyTab">
        <div class="glass-card">
            <form id="leaveForm">
                <div class="mb-3"><label class="form-label">选择课程</label><select class="form-select" id="courseId" required></select></div>
                <div class="mb-3"><label class="form-label">请假类型</label><select class="form-select" id="leaveType" required>
                    <option value="">请选择</option><option value="PERSONAL">🔹 事假</option><option value="SICK">🏥 病假</option><option value="OTHER">📌 其他</option>
                </select></div>
                <div class="mb-3"><label class="form-label">请假原因</label><textarea class="form-control" id="reason" rows="4" placeholder="请详细说明请假原因..." required maxlength="1000"></textarea><small class="text-muted"><span id="reasonCount">0</span>/1000</small></div>
                <button type="submit" class="btn btn-gradient w-100">📤 提交请假申请</button>
            </form>
        </div>
    </div>

    <!-- 请假记录 -->
    <div class="tab-pane fade" id="historyTab">
        <div class="glass-card">
            <div id="leaveList" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div>
        </div>
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
// 加载课程列表
async function loadCourses() {
    try {
        const courses = await get('/api/student/courses');
        const sel = document.getElementById('courseId');
        sel.innerHTML = '<option value="">请选择课程</option>' + courses.map(c =>
            `<option value="${c.id}">${escapeHtml(c.courseName)}</option>`
        ).join('');
    } catch(e) {
        if(e.message.includes('未登录')) navigateTo('/student/login.html');
    }
}

// 加载请假记录
async function loadLeaves() {
    try {
        const leaves = await get('/api/student/leaves');
        const el = document.getElementById('leaveList');
        if(!leaves || leaves.length === 0) {
            el.innerHTML = '<div class="text-center py-4 text-muted">📭 暂无请假记录</div>';
            return;
        }
        const statusBadge = s => s==='PENDING'?'<span class="badge bg-warning text-dark">待审核</span>'
            :s==='APPROVED'?'<span class="badge bg-success">已通过</span>'
            :'<span class="badge bg-danger">已驳回</span>';
        const typeName = t => ({PERSONAL:'事假',SICK:'病假',OTHER:'其他'}[t]||t);
        el.innerHTML = `<div class="table-responsive"><table class="table table-hover table-sm">
            <thead><tr><th>课程</th><th>类型</th><th>原因</th><th>状态</th><th>审批意见</th><th>申请时间</th></tr></thead>
            <tbody>${leaves.map(l => `<tr>
                <td>${escapeHtml(l.courseName||'课程'+l.courseId)}</td>
                <td>${typeName(l.leaveType)}</td>
                <td><small>${escapeHtml(l.reason)}</small></td>
                <td>${statusBadge(l.status)}</td>
                <td><small class="text-muted">${escapeHtml(l.teacherComment||'-')}</small></td>
                <td class="text-muted small">${formatDateTime(l.createdAt)}</td>
            </tr>`).join('')}</tbody></table></div>`;
    } catch(e) { showError(e.message); }
}

// 提交请假
document.getElementById('leaveForm').addEventListener('submit', async e => {
    e.preventDefault();
    const courseId = document.getElementById('courseId').value;
    const leaveType = document.getElementById('leaveType').value;
    const reason = document.getElementById('reason').value.trim();
    if(!courseId) { showError('请选择课程'); return; }
    if(!leaveType) { showError('请选择请假类型'); return; }
    if(!reason) { showError('请填写请假原因'); return; }
    try {
        await post('/api/student/leave', { courseId: parseInt(courseId), sessionId: null, leaveType, reason });
        showSuccess('请假申请已提交，请等待教师审批');
        document.getElementById('reason').value = '';
        document.getElementById('reasonCount').textContent = '0';
        // 切换到记录标签
        document.querySelector('[data-bs-target="#historyTab"]').click();
        loadLeaves();
    } catch(e) { showError(e.message); }
});

// 字数统计
document.getElementById('reason').addEventListener('input', function() {
    document.getElementById('reasonCount').textContent = this.value.length;
});

// 标签切换时加载记录
document.querySelector('[data-bs-target="#historyTab"]').addEventListener('click', loadLeaves);

loadCourses();
</script>
</body></html>
