<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>我的考勤</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center"><span class="navbar-brand">📊 我的考勤</span><button class="btn btn-outline-secondary" onclick="navigateTo('/student/courses.html')">← 返回</button></nav>
<div class="row g-3 mb-3" id="statsRow"></div>
<div class="glass-card"><h6 class="mb-3">📜 考勤记录</h6><div id="historyList" class="text-center py-4 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
const courseId=getUrlParam('courseId');
async function loadData(){if(!courseId){showError('缺少课程参数');return;}try{const[summary,history]=await Promise.all([get(`/api/student/courses/${courseId}/attendance/summary`),get(`/api/student/courses/${courseId}/attendance`)]);renderStats(summary);renderHistory(history);}catch(e){if(e.message.includes('未登录'))navigateTo('/student/login.html');else showError(e.message);}}
function renderStats(s){const rate=s.attendanceRate||0;const rc=rate<60?'rate-low':rate<80?'rate-medium':'rate-high';document.getElementById('statsRow').innerHTML=`<div class="col-6 col-md-2"><div class="stat-card text-center p-3"><div class="rate-circle ${rc} mx-auto"><span class="rate-num">${rate}%</span><span class="rate-label">出勤率</span></div></div></div><div class="col-6 col-md-2"><div class="stat-card text-center p-3" style="border-top:3px solid var(--success);"><div class="fs-4 fw-bold">${s.normalCount||0}</div><small class="text-muted">✅ 正常</small></div></div><div class="col-6 col-md-2"><div class="stat-card text-center p-3" style="border-top:3px solid var(--primary);"><div class="fs-4 fw-bold">${s.leaveCount||0}</div><small class="text-muted">📝 请假</small></div></div><div class="col-6 col-md-2"><div class="stat-card text-center p-3" style="border-top:3px solid var(--danger);"><div class="fs-4 fw-bold">${s.absentCount||0}</div><small class="text-muted">❌ 缺勤</small></div></div><div class="col-6 col-md-2"><div class="stat-card text-center p-3" style="border-top:3px solid var(--info);"><div class="fs-4 fw-bold">${s.totalSessions||0}</div><small class="text-muted">📋 总计</small></div></div>`;}
function renderHistory(history){const el=document.getElementById('historyList');if(!history||history.length===0){el.innerHTML='<div class="text-center py-4 text-muted">📭 暂无考勤记录</div>';return;}const statusBadge=s=>{const m={NORMAL:'<span class="badge bg-success">正常</span>',LEAVE:'<span class="badge bg-primary">请假</span>',ABSENT:'<span class="badge bg-danger">缺勤</span>',ABNORMAL:'<span class="badge bg-info">异常</span>'};return m[s]||`<span class="badge bg-secondary">${s}</span>`;};el.innerHTML=`<div class="table-responsive"><table class="table table-hover table-sm"><thead><tr><th>签到活动</th><th>签到时间</th><th>状态</th><th>说明</th></tr></thead><tbody>${history.map(h=>`<tr><td><small>${escapeHtml(h.sessionTitle||'签到#'+h.sessionId)}</small></td><td class="text-muted small">${h.signTime||'-'}</td><td>${statusBadge(h.status)}</td><td class="small text-muted">${escapeHtml(h.abnormalReason||'')}</td></tr>`).join('')}</tbody></table></div>`;}
loadData();
</script>
</body></html>
