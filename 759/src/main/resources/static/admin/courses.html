<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>课程查看 - 管理员</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center"><span class="navbar-brand">📖 课程查看</span><button class="btn btn-outline-secondary" onclick="navigateTo('/admin/dashboard.html')">← 返回</button></nav>
<div class="glass-card"><div id="courseList" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
let page=0;
async function loadCourses(){try{const r=await get(`/api/admin/courses?page=${page}&size=20`);const el=document.getElementById('courseList');if(!r.content||r.content.length===0){el.innerHTML='<div class="text-center py-5 text-muted">📭 暂无课程</div>';return;}
el.innerHTML=`<div class="table-responsive"><table class="table table-hover"><thead><tr><th>ID</th><th>课程名称</th><th>教师</th><th>创建时间</th></tr></thead><tbody>${r.content.map(c=>`<tr><td>${c.id}</td><td class="fw-bold">${escapeHtml(c.courseName)}</td><td>${escapeHtml(c.teacherName||'教师#'+c.teacherId)}</td><td class="text-muted small">${formatDateTime(c.createdAt)}</td></tr>`).join('')}</tbody></table></div>
<div class="d-flex justify-content-center gap-2 mt-3"><button class="btn btn-sm btn-outline-secondary" onclick="page=Math.max(0,page-1);loadCourses();" ${page===0?'disabled':''}>上一页</button><span class="btn btn-sm">${page+1}/${r.totalPages||1}</span><button class="btn btn-sm btn-outline-secondary" onclick="page++;loadCourses();" ${page>=r.totalPages-1?'disabled':''}>下一页</button></div>`;}
catch(e){if(e.message.includes('未登录'))navigateTo('/admin/login.html');}}
loadCourses();
</script>
</body></html>
