<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>管理员登录</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
<div class="glass-card" style="max-width:400px;width:100%;"><h3 class="text-center mb-4">🛡️ 管理员登录</h3>
<form id="loginForm"><div class="mb-3"><label class="form-label">用户名</label><input class="form-control" id="username" required autofocus></div>
<div class="mb-3"><label class="form-label">密码</label><input type="password" class="form-control" id="password" required></div>
<button type="submit" class="btn btn-gradient w-100 mb-3">登录</button>
<a href="/" class="d-block text-center text-muted small">← 返回首页</a></form></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const username=document.getElementById('username').value.trim();const password=document.getElementById('password').value.trim();if(!username||!password){showError('请输入用户名和密码');return;}try{await post('/api/auth/admin/login',{username,password});navigateTo('/admin/dashboard.html');}catch(e){showError(e.message);}});
</script>
</body></html>
