<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>系统配置</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="navbar-brand">⚙️ 系统配置</span>
    <button class="btn btn-outline-secondary" onclick="navigateTo('/admin/dashboard.html')">← 返回</button>
</nav>
<div class="glass-card"><div id="configList" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
async function loadConfigs(){try{const cfgs=await get('/api/admin/configs');const el=document.getElementById('configList');if(!cfgs||cfgs.length===0){el.innerHTML='<div class="text-muted">暂无配置</div>';return;}
el.innerHTML=`<table class="table table-hover"><thead><tr><th>配置键</th><th>配置值</th><th>类型</th><th>说明</th><th>操作</th></tr></thead><tbody>${cfgs.map(c=>`<tr><td><code>${escapeHtml(c.configKey)}</code></td><td><input class="form-control form-control-sm" id="val_${c.id}" value="${escapeHtml(c.configValue)}" style="width:120px;"></td><td><span class="badge bg-info">${c.configType}</span></td><td><small class="text-muted">${escapeHtml(c.description||'')}</small></td><td><button class="btn btn-sm btn-gradient" onclick="saveConfig('${c.configKey}','${c.id}')">保存</button></td></tr>`).join('')}</tbody></table>`;}catch(e){if(e.message.includes('未登录'))navigateTo('/admin/login.html');}}
async function saveConfig(key,id){const val=document.getElementById('val_'+id).value.trim();try{await put('/api/admin/configs',{key,value:val});showToast('已更新','success');}catch(e){showError(e.message);}}
loadConfigs();
</script>
</body></html>
