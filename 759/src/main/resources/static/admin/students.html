<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>学生管理 - 管理员</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="navbar-brand">👥 学生管理</span>
    <div class="d-flex gap-2">
        <button class="btn btn-gradient" onclick="showStudentModal()">+ 添加学生</button>
        <button class="btn btn-outline-secondary" onclick="navigateTo('/admin/dashboard.html')">← 返回</button>
    </div>
</nav>
<div class="row g-2 mb-3"><div class="col"><input class="form-control" id="keyword" placeholder="搜索学号、姓名..." oninput="debouncedSearch()"></div><div class="col-auto"><button class="btn btn-outline-primary" onclick="loadStudents()">🔍</button></div></div>
<div class="glass-card"><div id="studentList" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
let currentPage=0;
const debouncedSearch=debounce(()=>{currentPage=0;loadStudents();},400);
async function loadStudents(){const k=document.getElementById('keyword').value.trim()||null;try{const r=await get(`/api/admin/students?keyword=${k||''}&page=${currentPage}&size=15`);renderStudents(r);}catch(e){if(e.message.includes('未登录'))navigateTo('/admin/login.html');}}
function renderStudents(r){const el=document.getElementById('studentList');if(!r.content||r.content.length===0){el.innerHTML='<div class="text-center py-5 text-muted">📭 暂无数据</div>';return;}
el.innerHTML=`<div class="table-responsive"><table class="table table-hover"><thead><tr><th>学号</th><th>姓名</th><th>班级</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${r.content.map(s=>`<tr><td>${escapeHtml(s.studentNo)}</td><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.className||'-')}</td><td>${s.status==='DISABLED'?'<span class="badge bg-danger">已禁用</span>':'<span class="badge bg-success">正常</span>'}</td><td class="text-muted small">${formatDateTime(s.createdAt)}</td><td>
        <button class="btn btn-sm btn-outline-warning me-1" onclick="resetPwd(${s.id})">🔑</button>
        <button class="btn btn-sm ${s.status==='DISABLED'?'btn-success':'btn-outline-danger'} me-1" onclick="toggleStatus(${s.id})">${s.status==='DISABLED'?'▶ 启用':'⏸ 禁用'}</button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${s.id},'${escapeHtml(s.name)}')">🗑</button>
    </td></tr>`).join('')}</tbody></table></div>
<div class="d-flex justify-content-center gap-2 mt-3"><button class="btn btn-sm btn-outline-secondary" onclick="currentPage=Math.max(0,currentPage-1);loadStudents();" ${currentPage===0?'disabled':''}>上一页</button><span class="btn btn-sm">${currentPage+1}/${r.totalPages||1}</span><button class="btn btn-sm btn-outline-secondary" onclick="currentPage++;loadStudents();" ${currentPage>=r.totalPages-1?'disabled':''}>下一页</button></div>`;}
function showStudentModal(){const m=`<div class="modal fade" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>添加学生</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="mb-3"><label>学号</label><input class="form-control" id="sNo"></div><div class="mb-3"><label>姓名</label><input class="form-control" id="sName"></div><div class="mb-3"><label>班级</label><input class="form-control" id="sClass"></div><div class="mb-3"><label>密码（默认123456）</label><input class="form-control" id="sPwd" value="123456"></div></div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-gradient" id="saveBtn">保存</button></div></div></div></div>`;const w=document.createElement('div');w.innerHTML=m;document.body.appendChild(w.firstElementChild);const modal=new bootstrap.Modal(document.body.lastElementChild);modal.show();modal._element.addEventListener('hidden.bs.modal',()=>modal._element.remove());document.getElementById('saveBtn').onclick=async()=>{const no=document.getElementById('sNo').value.trim();const name=document.getElementById('sName').value.trim();const cls=document.getElementById('sClass').value.trim();const pwd=document.getElementById('sPwd').value.trim()||'123456';if(!no||!name){showError('学号和姓名不能为空');return;}try{await post('/api/admin/students',{studentNo:no,name,password:pwd,className:cls||null});modal.hide();showSuccess('添加成功');loadStudents();}catch(e){showError(e.message);}};}
async function resetPwd(id){const pwd=prompt('请输入新密码（默认123456）:','123456');if(!pwd)return;try{await post(`/api/admin/students/${id}/reset-password`,{password:pwd});showSuccess('密码已重置');}catch(e){showError(e.message);}}
async function toggleStatus(id){try{const s=await post(`/api/admin/students/${id}/toggle-status`);showToast(s.status==='DISABLED'?'已禁用':'已启用','success');loadStudents();}catch(e){showError(e.message);}}
async function deleteStudent(id,name){showConfirm('删除学生',`确定删除 ${name} 吗？`,async()=>{try{await del(`/api/admin/students/${id}`);showSuccess('已删除');loadStudents();}catch(e){showError(e.message);}});}
loadStudents();
</script>
</body></html>
