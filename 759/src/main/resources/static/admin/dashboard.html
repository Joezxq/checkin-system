<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>管理员后台</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="navbar-brand">🛡️ 管理员后台</span>
    <div class="d-flex gap-2 flex-wrap">
        <button class="btn btn-outline-primary" onclick="navigateTo('/admin/teachers.html')">👨‍🏫 教师管理</button>
        <button class="btn btn-outline-primary" onclick="navigateTo('/admin/students.html')">👥 学生管理</button>
        <button class="btn btn-outline-info" onclick="navigateTo('/admin/courses.html')">📖 课程查看</button>
        <button class="btn btn-outline-info" onclick="navigateTo('/admin/config.html')">⚙️ 系统配置</button>
        <button class="btn btn-outline-secondary" onclick="navigateTo('/admin/logs.html')">📜 操作日志</button>
        <button class="btn btn-outline-danger" onclick="logout()">退出</button>
    </div>
</nav>

<div class="row g-3 mb-3" id="statsRow">
    <div class="col-6 col-md-2"><div class="stat-card text-center p-3"><div class="fs-3" id="teacherCount">-</div><small class="text-muted">👨‍🏫 教师数</small></div></div>
    <div class="col-6 col-md-2"><div class="stat-card text-center p-3"><div class="fs-3" id="studentCount">-</div><small class="text-muted">👥 学生数</small></div></div>
    <div class="col-6 col-md-2"><div class="stat-card text-center p-3"><div class="fs-3" id="courseCount">-</div><small class="text-muted">📖 课程数</small></div></div>
    <div class="col-6 col-md-2"><div class="stat-card text-center p-3"><div class="fs-3 text-success" id="activeSessionCount">-</div><small class="text-muted">🟢 进行中签到</small></div></div>
    <div class="col-6 col-md-2"><div class="stat-card text-center p-3"><div class="fs-3 text-primary" id="todaySignCount">-</div><small class="text-muted">📋 今日签到</small></div></div>
    <div class="col-6 col-md-2"><div class="stat-card text-center p-3"><button class="btn btn-sm btn-gradient w-100" onclick="loadDashboard()">🔄 刷新</button></div></div>
</div>

<div class="glass-card"><h5 class="mb-3">📋 最近操作日志</h5><div id="recentLogs" class="text-center py-3 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
async function loadDashboard(){
    try{
        const d=await get('/api/admin/dashboard');
        document.getElementById('teacherCount').textContent=d.teacherCount;
        document.getElementById('studentCount').textContent=d.studentCount;
        document.getElementById('courseCount').textContent=d.courseCount;
        document.getElementById('activeSessionCount').textContent=d.activeSessionCount;
        document.getElementById('todaySignCount').textContent=d.todaySignCount;
    }catch(e){if(e.message.includes('未登录'))navigateTo('/admin/login.html');}
}
async function loadLogs(){
    try{
        const r=await get('/api/admin/logs?page=0&size=10');
        const el=document.getElementById('recentLogs');
        const logs=r.content;
        if(!logs||logs.length===0){el.innerHTML='<div class="text-muted">暂无日志</div>';return;}
        el.innerHTML=`<div class="table-responsive"><table class="table table-sm table-hover"><thead><tr><th>时间</th><th>角色</th><th>用户</th><th>操作</th><th>目标</th><th>详情</th></tr></thead><tbody>${logs.map(l=>`<tr><td class="text-muted small">${formatDateTime(l.createdAt)}</td><td>${l.userType}</td><td>${escapeHtml(l.userName||'')}</td><td><span class="badge bg-secondary">${l.operation}</span></td><td>${escapeHtml(l.targetType||'')}${l.targetId?'#'+l.targetId:''}</td><td class="small">${escapeHtml(l.detail||'')}</td></tr>`).join('')}</tbody></table></div>`;
    }catch(e){console.error(e);}
}
loadDashboard();
loadLogs();
</script>
</body></html>
