<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>教师管理 - 管理员</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="navbar-brand">👨‍🏫 教师管理</span>
    <div class="d-flex gap-2">
        <button class="btn btn-gradient" onclick="showTeacherModal()">+ 添加教师</button>
        <button class="btn btn-outline-secondary" onclick="navigateTo('/admin/dashboard.html')">← 返回</button>
    </div>
</nav>
<div class="row g-2 mb-3"><div class="col"><input class="form-control" id="keyword" placeholder="搜索工号、姓名..." oninput="debouncedSearch()"></div><div class="col-auto"><button class="btn btn-outline-primary" onclick="loadTeachers()">🔍</button></div></div>
<div class="glass-card"><div id="teacherList" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
let currentPage=0;
const debouncedSearch=debounce(()=>{currentPage=0;loadTeachers();},400);

async function loadTeachers(){
    const k=document.getElementById('keyword').value.trim()||null;
    try{const r=await get(`/api/admin/teachers?keyword=${k||''}&page=${currentPage}&size=15`);renderTeachers(r);}
    catch(e){if(e.message.includes('未登录'))navigateTo('/admin/login.html');}
}

function renderTeachers(r){
    const el=document.getElementById('teacherList');
    if(!r.content||r.content.length===0){el.innerHTML='<div class="text-center py-5 text-muted">📭 暂无教师</div>';return;}
    el.innerHTML=`<div class="table-responsive"><table class="table table-hover"><thead><tr><th>工号</th><th>姓名</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${r.content.map(t=>`<tr><td>${escapeHtml(t.teacherNo)}</td><td>${escapeHtml(t.name)}</td><td>${t.status==='DISABLED'?'<span class="badge bg-danger">已禁用</span>':'<span class="badge bg-success">正常</span>'}</td><td class="text-muted small">${formatDateTime(t.createdAt)}</td><td>
        <button class="btn btn-sm btn-outline-warning me-1" onclick="resetPwd(${t.id})">🔑</button>
        <button class="btn btn-sm btn-outline-info me-1" onclick="editTeacher(${t.id},'${escapeHtml(t.teacherNo)}','${escapeHtml(t.name).replace(/'/g,"\\'")}')">✏️</button>
        <button class="btn btn-sm ${t.status==='DISABLED'?'btn-success':'btn-outline-danger'} me-1" onclick="toggleStatus(${t.id})">${t.status==='DISABLED'?'▶ 启用':'⏸ 禁用'}</button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteTeacher(${t.id},'${escapeHtml(t.name)}')">🗑</button>
    </td></tr>`).join('')}</tbody></table></div>
    <div class="d-flex justify-content-center gap-2 mt-3"><button class="btn btn-sm btn-outline-secondary" onclick="currentPage=Math.max(0,currentPage-1);loadTeachers();" ${currentPage===0?'disabled':''}>上一页</button><span class="btn btn-sm">${currentPage+1}/${r.totalPages||1}</span><button class="btn btn-sm btn-outline-secondary" onclick="currentPage++;loadTeachers();" ${currentPage>=r.totalPages-1?'disabled':''}>下一页</button></div>`;
}

function showTeacherModal(teacher){
    const isEdit=!!teacher;
    const m=`<div class="modal fade" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5>${isEdit?'编辑教师':'添加教师'}</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">
        <div class="mb-3"><label>工号</label><input class="form-control" id="tNo" value="${isEdit?teacher.teacherNo:''}" ${isEdit?'readonly':''}></div>
        <div class="mb-3"><label>姓名</label><input class="form-control" id="tName" value="${isEdit?teacher.name:''}"></div>
        ${isEdit?'':'<div class="mb-3"><label>密码（默认password）</label><input class="form-control" id="tPwd" value="password"></div>'}
    </div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-gradient" id="saveBtn">保存</button></div></div></div></div>`;
    const w=document.createElement('div');w.innerHTML=m;document.body.appendChild(w.firstElementChild);
    const modal=new bootstrap.Modal(document.body.lastElementChild);modal.show();
    modal._element.addEventListener('hidden.bs.modal',()=>modal._element.remove());
    document.getElementById('saveBtn').onclick=async()=>{
        const no=document.getElementById('tNo').value.trim();
        const name=document.getElementById('tName').value.trim();
        if(!no||!name){showError('工号和姓名不能为空');return;}
        try{
            if(isEdit)await put(`/api/admin/teachers/${teacher.id}`,{teacherNo:no,name});
            else {
                const pwd=document.getElementById('tPwd').value.trim()||'password';
                await post('/api/admin/teachers',{teacherNo:no,name,password:pwd});
            }
            modal.hide();showSuccess(isEdit?'已更新':'已创建');loadTeachers();
        }catch(e){showError(e.message);}
    };
}

function editTeacher(id,no,name){showTeacherModal({id,teacherNo:no,name});}
async function resetPwd(id){const pwd=prompt('请输入新密码（默认password）:','password');if(!pwd)return;try{await post(`/api/admin/teachers/${id}/reset-password`,{password:pwd});showSuccess('密码已重置');}catch(e){showError(e.message);}}
async function toggleStatus(id){try{const t=await post(`/api/admin/teachers/${id}/toggle-status`);showToast(t.status==='DISABLED'?'已禁用':'已启用','success');loadTeachers();}catch(e){showError(e.message);}}
async function deleteTeacher(id,name){showConfirm('删除教师',`确定删除 ${name} 吗？`,async()=>{try{await del(`/api/admin/teachers/${id}`);showSuccess('已删除');loadTeachers();}catch(e){showError(e.message);}});}
loadTeachers();
</script>
</body></html>
