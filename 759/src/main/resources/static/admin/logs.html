<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>操作日志</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/common/custom.css">
</head>
<body><div class="app-container">
<nav class="app-navbar d-flex justify-content-between align-items-center"><span class="navbar-brand">📜 操作日志</span><button class="btn btn-outline-secondary" onclick="navigateTo('/admin/dashboard.html')">← 返回</button></nav>
<div class="glass-card"><div id="logList" class="text-center py-5 text-muted"><div class="spinner-custom"></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/common/utils.js"></script>
<script>
let page=0;
async function loadLogs(){try{const r=await get(`/api/admin/logs?page=${page}&size=20`);const el=document.getElementById('logList');if(!r.content||r.content.length===0){el.innerHTML='<div class="text-muted">暂无日志</div>';return;}
el.innerHTML=`<div class="table-responsive"><table class="table table-hover table-sm"><thead><tr><th>时间</th><th>用户类型</th><th>用户</th><th>操作</th><th>目标</th><th>详情</th></tr></thead><tbody>${r.content.map(l=>`<tr><td class="text-muted small">${formatDateTime(l.createdAt)}</td><td><span class="badge bg-secondary">${l.userType}</span></td><td>${escapeHtml(l.userName||'')}</td><td>${l.operation}</td><td>${escapeHtml(l.targetType||'')}${l.targetId?' #'+l.targetId:''}</td><td class="small">${escapeHtml(l.detail||'')}</td></tr>`).join('')}</tbody></table></div>
<div class="d-flex justify-content-center gap-2 mt-3"><button class="btn btn-sm btn-outline-secondary" onclick="page=Math.max(0,page-1);loadLogs();" ${page===0?'disabled':''}>上一页</button><span class="btn btn-sm">${page+1}/${r.totalPages||1}</span><button class="btn btn-sm btn-outline-secondary" onclick="page++;loadLogs();" ${page>=r.totalPages-1?'disabled':''}>下一页</button></div>`;}catch(e){if(e.message.includes('未登录'))navigateTo('/admin/login.html');}}
loadLogs();
</script>
</body></html>
